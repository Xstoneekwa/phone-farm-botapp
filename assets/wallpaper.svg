  <ellipse cx="700" cy="500" rx="260" ry="180" fill="#F5D8C0" opacity="0.30" filter="url(#blur2)" transform="rotate(5 700 500)"></ellipse>
  
  <ellipse cx="1360" cy="120" rx="220" ry="180" fill="#B8D4F0" opacity="0.35" filter="url(#blur1)" transform="rotate(-30 1360 120)"></ellipse>
