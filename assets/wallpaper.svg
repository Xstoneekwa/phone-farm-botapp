  <rect width="1440" height="900" fill="#F7F6F2"></rect>
  
  <ellipse cx="960" cy="180" rx="380" ry="260" fill="#F2C4CE" opacity="0.55" filter="url(#blur1)" transform="rotate(-15 960 180)"></ellipse>
  
  <ellipse cx="280" cy="680" rx="340" ry="220" fill="#A8D5C2" opacity="0.45" filter="url(#blur2)" transform="rotate(20 280 680)"></ellipse>
  
