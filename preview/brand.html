<!-- @dsCard group="Brand" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-canvas); font-family: var(--font-sans); padding: 20px 24px; }
  .row { display: flex; align-items: center; gap: 24px; }
  .icon-showcase { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon-label { font-size: 10px; color: var(--fg-tertiary); }
  .sep { width: 1px; height: 80px; background: var(--border-default); }
  .wordmark { display: flex; flex-direction: column; gap: 4px; }
  .wordmark-primary { font-size: 28px; font-weight: 700; color: var(--fg-primary); letter-spacing: -0.03em; line-height: 1; }
  .wordmark-sub { font-size: 12px; font-weight: 400; color: var(--fg-secondary); }
  .accent-dot { width: 16px; height: 16px; border-radius: 50%; }
</style>
</head>
<body>
<div class="row">

  <!-- Icon sizes -->
  <div style="display:flex;align-items:flex-end;gap:10px;">

    <!-- 80px — main icon with IG automation motif -->
    <div class="icon-showcase">
      <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- IG-inspired gradient: orange → pink → purple → indigo -->
          <linearGradient id="igGrad80" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#F58529"/>
            <stop offset="30%"  stop-color="#DD2A7B"/>
            <stop offset="65%"  stop-color="#8134AF"/>
            <stop offset="100%" stop-color="#6558F5"/>
          </linearGradient>
          <linearGradient id="shineGrad80" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <!-- Background rounded square -->
        <rect width="80" height="80" rx="18" fill="url(#igGrad80)"/>
        <!-- Shine overlay -->
        <rect width="80" height="40" rx="18" fill="url(#shineGrad80)"/>
        <!-- IG camera outline (outer rounded square) -->
        <rect x="16" y="16" width="48" height="48" rx="12" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="2.5"/>
        <!-- IG lens circle -->
        <circle cx="40" cy="40" r="11" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="2.5"/>
        <!-- Automation bolt overlaid (white, solid) -->
        <path d="M43 22 L33 40 H40 L37 58 L50 36 H43 Z" fill="white" opacity="0.95"/>
        <!-- IG viewfinder dot (top-right) -->
        <circle cx="57" cy="23" r="3.5" fill="white" opacity="0.85"/>
      </svg>
      <div class="icon-label">80px</div>
    </div>

    <!-- 48px -->
    <div class="icon-showcase">
      <svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="igGrad48" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F58529"/>
            <stop offset="35%" stop-color="#DD2A7B"/>
            <stop offset="70%" stop-color="#8134AF"/>
            <stop offset="100%" stop-color="#6558F5"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="11" fill="url(#igGrad48)"/>
        <rect x="9" y="9" width="30" height="30" rx="7.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
        <circle cx="24" cy="24" r="6.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
        <path d="M26 13 L20 24 H24.5 L22 35 L30.5 22 H26 Z" fill="white" opacity="0.95"/>
        <circle cx="34" cy="14" r="2" fill="white" opacity="0.85"/>
      </svg>
      <div class="icon-label">48px</div>
    </div>

    <!-- 28px -->
    <div class="icon-showcase">
      <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="igGrad28" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F58529"/>
            <stop offset="50%" stop-color="#DD2A7B"/>
            <stop offset="100%" stop-color="#6558F5"/>
          </linearGradient>
        </defs>
        <rect width="28" height="28" rx="7" fill="url(#igGrad28)"/>
        <path d="M15.5 7.5 L11 14 H14.5 L12.5 20.5 L19 13 H15.5 Z" fill="white" opacity="0.95"/>
        <circle cx="20.5" cy="8" r="1.8" fill="white" opacity="0.8"/>
      </svg>
      <div class="icon-label">28px</div>
    </div>

    <!-- Rail 22px -->
    <div class="icon-showcase">
      <svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="igGradRail" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F58529"/>
            <stop offset="50%" stop-color="#DD2A7B"/>
            <stop offset="100%" stop-color="#6558F5"/>
          </linearGradient>
        </defs>
        <rect width="22" height="22" rx="5.5" fill="url(#igGradRail)"/>
        <path d="M12.5 5.5 L8.5 11 H11.5 L9.5 16.5 L15.5 11 H12.5 Z" fill="white" opacity="0.95"/>
      </svg>
      <div class="icon-label">Rail</div>
    </div>
  </div>

  <div class="sep"></div>

  <!-- Wordmark -->
  <div class="wordmark">
    <div class="wordmark-primary">BotApp</div>
    <div class="wordmark-sub">by Boost My Businesses</div>
    <div style="margin-top:6px;display:flex;align-items:center;gap:6px;">
      <!-- IG + zap badge -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="url(#igLineGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="igLineGrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#F58529"/><stop offset="100%" stop-color="#8134AF"/></linearGradient></defs>
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="5"/>
        <circle cx="17.5" cy="6.5" r="1" fill="#F58529" stroke="none"/>
      </svg>
      <span style="font-size:11px;font-family:var(--font-mono);color:var(--fg-tertiary);">Instagram Automation</span>
    </div>
    <div style="margin-top:2px;font-size:11px;font-family:var(--font-mono);color:var(--fg-tertiary);">bots.propulseachieve.com</div>
  </div>

  <div class="sep"></div>

  <!-- Gradient palette -->
  <div style="display:flex;flex-direction:column;gap:8px;">
    <div style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--fg-tertiary);">IG × BotApp gradient</div>
    <div style="height:18px;width:140px;border-radius:9px;background:linear-gradient(90deg,#F58529,#DD2A7B,#8134AF,#6558F5);"></div>
    <div style="display:flex;gap:4px;margin-top:2px;">
      <div class="accent-dot" style="background:#F58529;" title="#F58529"></div>
      <div class="accent-dot" style="background:#DD2A7B;" title="#DD2A7B"></div>
      <div class="accent-dot" style="background:#8134AF;" title="#8134AF"></div>
      <div class="accent-dot" style="background:#6558F5;" title="#6558F5"></div>
    </div>
    <div style="font-size:10px;color:var(--fg-tertiary);margin-top:4px;">IG orange → IG pink → IG purple → Accent</div>
  </div>

</div>
</body>
</html>
