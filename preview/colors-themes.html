<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-canvas); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 10px; }
  .theme-card { flex: 1; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-sm); border: 2px solid transparent; }
  .theme-card.active { border-color: var(--accent); }
  .theme-preview { height: 44px; display: flex; overflow: hidden; }
  .theme-preview div { flex: 1; }
  .theme-info { background: white; padding: 8px 10px; }
  .theme-name { font-size: 12px; font-weight: 600; color: var(--fg-primary); }
  .theme-desc { font-size: 10px; color: var(--fg-secondary); margin-top: 2px; }
  .current-badge { display: inline-block; font-size: 10px; color: var(--accent); font-weight: 500; margin-top: 3px; }
</style>
</head>
<body>
<div class="row">
  <div class="theme-card active">
    <div class="theme-preview">
      <div style="background:#F7F6F2"></div>
      <div style="background:#6558F5"></div>
      <div style="background:#1F2328"></div>
    </div>
    <div class="theme-info">
      <div class="theme-name">MacOS Light</div>
      <div class="theme-desc">Premium native light mode</div>
      <div class="current-badge">Current</div>
    </div>
  </div>
  <div class="theme-card">
    <div class="theme-preview">
      <div style="background:#0F1012"></div>
      <div style="background:#6558F5"></div>
      <div style="background:#E0E0E0"></div>
    </div>
    <div class="theme-info">
      <div class="theme-name">MacOS Dark</div>
      <div class="theme-desc">Premium native dark mode</div>
    </div>
  </div>
  <div class="theme-card">
    <div class="theme-preview">
      <div style="background:#B8C4D0"></div>
      <div style="background:#6558F5"></div>
      <div style="background:#0D9488"></div>
    </div>
    <div class="theme-info">
      <div class="theme-name">Legacy</div>
      <div class="theme-desc">Blue-grey canvas, purple + teal</div>
    </div>
  </div>
  <div class="theme-card">
    <div class="theme-preview">
      <div style="background:#F7F6F2"></div>
      <div style="background:#6558F5"></div>
      <div style="background:#1F2328"></div>
    </div>
    <div class="theme-info">
      <div class="theme-name">Custom</div>
      <div class="theme-desc">Your colors below</div>
    </div>
  </div>
</div>
</body>
</html>
