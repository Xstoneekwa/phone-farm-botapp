<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F7F7F6; font-family: "Inter", system-ui, sans-serif; padding: 16px; }
  .table-wrap { background: #fff; border: 1px solid #E6E6E4; border-radius: 8px; overflow: hidden; }
  table { border-collapse: collapse; width: 100%; }
  thead th { padding: 0 12px; height: 32px; font-size: 10px; font-weight: 500; color: #9EA3B0; text-align: left; border-bottom: 1px solid #E6E6E4; background: #FAFAF9; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  tbody td { padding: 0 12px; height: 38px; font-size: 12px; color: #0F1117; border-bottom: 1px solid #F0F0EE; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  .mono { font-family: "JetBrains Mono", monospace; color: #9EA3B0; font-size: 11px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 9999px; font-size: 10px; font-weight: 500; white-space: nowrap; }
  .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .time-pill { display: inline-flex; padding: 3px 8px; background: #111213; color: #fff; border-radius: 9999px; font-size: 10px; font-weight: 500; font-family: "JetBrains Mono", monospace; }
  .chg { display: inline-flex; padding: 2px 6px; border-radius: 9999px; font-size: 10px; font-weight: 500; }
  .action-btn { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #E6E6E4; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6B7280; padding: 0; }
  .ig-icon { width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(135deg,#f58529,#dd2a7b,#8134af); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
</style>
</head>
<body>
<div class="table-wrap">
  <!-- Group header -->
  <div style="display:flex;align-items:center;gap:8px;padding:5px 12px;background:#F7F7F6;border-bottom:1px solid #E6E6E4;">
    <span style="width:7px;height:7px;border-radius:50%;background:#22C55E;flex-shrink:0"></span>
    <span style="font-size:11px;font-weight:600;color:#0F1117">Phone 1</span>
    <span class="mono">R39M10F3EHW</span>
    <span style="font-size:10px;color:#9EA3B0">6 profiles</span>
    <span style="margin-left:auto;font-size:10px;color:#6558F5;font-weight:500">3 running · 1 error</span>
  </div>
  <table>
    <thead>
      <tr>
        <th style="width:16px"></th>
        <th>Account</th>
        <th>Plan</th>
        <th>Time Slot</th>
        <th style="text-align:center">Status</th>
        <th style="text-align:right">Follows</th>
        <th style="text-align:right">Likes</th>
        <th style="text-align:right">DMs</th>
        <th style="text-align:right">Δ Today</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><div style="width:8px;height:8px;border-radius:50%;background:#F97316"></div></td>
        <td>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="ig-icon"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/></svg></div>
            <span style="font-weight:500">com_uniti20</span>
          </div>
        </td>
        <td style="color:#5C6070">Com'Uniti</td>
        <td><span class="time-pill">00:00–04:00</span></td>
        <td style="text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:#22C55E"></span><span style="font-size:11px;color:#22C55E;font-weight:500">running</span></div></td>
        <td style="text-align:right;font-weight:500;font-variant-numeric:tabular-nums">55</td>
        <td style="text-align:right;color:#5C6070;font-variant-numeric:tabular-nums">130</td>
        <td style="text-align:right;color:#5C6070;font-variant-numeric:tabular-nums">0</td>
        <td style="text-align:right"><span class="chg" style="background:#CCFBF1;color:#134E4A">+54</span></td>
        <td><div style="display:flex;gap:3px"><button class="action-btn"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button><button class="action-btn"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="action-btn" style="border-color:#FECACA;color:#DC2626"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg></button></div></td>
      </tr>
      <tr>
        <td><div style="width:8px;height:8px;border-radius:50%;background:#EF4444"></div></td>
        <td>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="ig-icon"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/></svg></div>
            <span style="font-weight:500">piece_unique_interiors</span>
            <span style="font-size:9px;font-weight:600;background:#F0F0EB;color:#6B7280;padding:1px 4px;border-radius:3px">2FA</span>
          </div>
        </td>
        <td style="color:#5C6070">PRO / Propulse</td>
        <td><span class="time-pill">08:00–11:00</span></td>
        <td style="text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:#DC2626"></span><span style="font-size:11px;color:#DC2626;font-weight:500">error</span></div></td>
        <td style="text-align:right;font-weight:500;font-variant-numeric:tabular-nums">4</td>
        <td style="text-align:right;color:#5C6070;font-variant-numeric:tabular-nums">8</td>
        <td style="text-align:right;color:#5C6070;font-variant-numeric:tabular-nums">8</td>
        <td style="text-align:right"><span class="chg" style="background:#CCFBF1;color:#134E4A">+93</span></td>
        <td><div style="display:flex;gap:3px"><button class="action-btn"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg></button><button class="action-btn"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="action-btn" style="border-color:#FECACA;color:#DC2626"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg></button></div></td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
