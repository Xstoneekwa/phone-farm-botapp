<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-canvas); font-family: var(--font-sans); padding: 16px; }
  .table { background: white; border: 1px solid var(--border-subtle); border-radius: 8px; overflow: hidden; }
  .group-header { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--bg-canvas); border-bottom: 1px solid var(--border-subtle); font-size: 11px; font-weight: 500; color: var(--fg-secondary); }
  .dot-status { width: 7px; height: 7px; border-radius: 50%; background: #22C55E; }
  .row { display: flex; align-items: center; gap: 0; padding: 0 12px; height: 42px; border-bottom: 1px solid var(--border-subtle); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .col-dot { width: 10px; margin-right: 8px; }
  .profile-dot { width: 9px; height: 9px; border-radius: 50%; }
  .col-name { width: 160px; font-weight: 500; color: var(--fg-primary); display: flex; align-items: center; gap: 6px; }
  .col-platform { width: 32px; display: flex; align-items: center; }
  .col-slot { width: 32px; font-size: 11px; color: var(--fg-secondary); }
  .col-plan { width: 120px; font-size: 12px; color: var(--fg-secondary); }
  .col-email { flex: 1; }
  .col-email input { width: 100%; border: 1px solid var(--border-subtle); background: var(--bg-input); border-radius: 4px; padding: 3px 8px; font-size: 12px; font-family: var(--font-sans); color: var(--fg-secondary); outline: none; }
  .col-time { width: 80px; font-size: 11px; font-family: var(--font-mono); color: var(--fg-secondary); }
  .col-slot-pill { width: 96px; }
  .time-pill { display: inline-flex; padding: 3px 9px; background: #1F2328; color: white; border-radius: 9999px; font-size: 11px; font-weight: 500; }
  .col-stats { flex: 1; font-size: 11px; color: var(--fg-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .col-badges { width: 80px; display: flex; gap: 4px; }
  .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 9999px; font-size: 11px; font-weight: 500; }
  .col-actions { width: 130px; display: flex; gap: 3px; justify-content: flex-end; }
  .act-btn { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border-subtle); background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--fg-secondary); }
  /* IG icon approximate */
  .ig-icon { width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg,#f58529,#dd2a7b,#8134af); display: flex; align-items: center; justify-content: center; }
  .ig-icon svg { width: 10px; height: 10px; }
  .badge-2fa { font-size: 9px; font-weight: 600; background: var(--bg-input); color: var(--fg-secondary); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="table">
  <div class="group-header">
    <span class="dot-status"></span>
    <span>Phone 1</span>
    <span style="font-family:var(--font-mono);font-size:10px;">R39M10F3EHW</span>
    <span style="margin-left:auto;color:var(--accent);font-size:10px;">6 profiles</span>
  </div>
  <div class="row">
    <div class="col-dot"><div class="profile-dot" style="background:#F97316"></div></div>
    <div class="col-name">
      <span>com_uniti20</span>
    </div>
    <div class="col-platform">
      <div class="ig-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="18" cy="6" r="1" fill="white"/></svg></div>
    </div>
    <div class="col-slot">#3</div>
    <div class="col-plan">Com'Uniti</div>
    <div class="col-email"><input type="text" placeholder="Email here"/></div>
    <div class="col-time" style="margin-left:8px;">04:00:00</div>
    <div class="col-slot-pill" style="margin-left:6px;"><span class="time-pill">00:00–04:00</span></div>
    <div class="col-stats" style="margin-left:8px;">55 F · 7 UF · 130 L · 0 DM · 4 Stories</div>
    <div class="col-badges">
      <span class="badge" style="background:#CCFBF1;color:#134E4A;">+54 ↑</span>
      <span class="badge" style="background:#F3F4F6;color:#6B7280;">0</span>
    </div>
    <div class="col-actions">
      <div class="act-btn"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
      <div class="act-btn"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div>
      <div class="act-btn"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      <div class="act-btn"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg></div>
      <div class="act-btn"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
      <div class="act-btn" style="color:#EF4444;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
