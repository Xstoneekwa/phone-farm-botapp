<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-canvas); font-family: var(--font-sans); padding: 20px 24px; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 500; line-height: 1; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .sep { width: 1px; height: 24px; background: var(--border-default); }
</style>
</head>
<body>
<div class="row">
  <!-- Connection status -->
  <span class="badge" style="background:#DCFCE7;color:#166534;">
    <span class="dot" style="background:#22C55E"></span>Connected
  </span>
  <span class="badge" style="background:#FEE2E2;color:#991B1B;">
    <span class="dot" style="background:#F87171"></span>Disconnected
  </span>
  <div class="sep"></div>
  <!-- Activity status -->
  <span class="badge" style="background:#DCFCE7;color:#166534;">Active</span>
  <span class="badge" style="background:#DCFCE7;color:#166534;">Running</span>
  <span class="badge" style="background:#FEF3C7;color:#92400E;">Empty</span>
  <div class="sep"></div>
  <!-- Change badges -->
  <span class="badge" style="background:#CCFBF1;color:#134E4A;">+54 ↑</span>
  <span class="badge" style="background:#CCFBF1;color:#134E4A;">+117 ↑</span>
  <span class="badge" style="background:#F3F4F6;color:#6B7280;">0</span>
  <span class="badge" style="background:#CCFBF1;color:#134E4A;">+8</span>
  <div class="sep"></div>
  <!-- Misc -->
  <span class="badge" style="background:#EDE9FE;color:#4338CA;">2 active · 2 total</span>
  <span class="badge" style="background:var(--bg-input);color:var(--fg-secondary);font-size:10px;letter-spacing:0.04em;text-transform:uppercase;">Tunnel active</span>
</div>
</body>
</html>
