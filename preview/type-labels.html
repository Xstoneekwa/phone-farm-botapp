<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-canvas); font-family: var(--font-sans); padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 32px; }
  .item { }
  .label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-secondary); margin-bottom: 5px; }
  .sample-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-secondary); }
  .sample-title { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg-primary); }
  .sample-desc  { font-size: 13px; color: var(--fg-secondary); margin-top: 2px; }
  .sample-data  { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--fg-primary); }
  .sample-id    { font-size: 11px; font-family: var(--font-mono); color: var(--fg-secondary); background: var(--bg-input); padding: 2px 6px; border-radius: 4px; display: inline-block; }
  .sample-timestamp { font-size: 12px; font-family: var(--font-mono); color: var(--fg-secondary); }
</style>
</head>
<body>
<div class="grid">
  <div class="item">
    <div class="label">Page header pattern</div>
    <div class="sample-label">SYSTEM</div>
    <div class="sample-title">Appearance</div>
    <div class="sample-desc">Theme, colors, typography, and interface preferences.</div>
  </div>
  <div class="item">
    <div class="label">Data row pattern</div>
    <div class="sample-data">43 saved · 39 active · 4 offline</div>
    <div style="height:8px"></div>
    <div class="sample-id">R39M10F3EHW</div>
    <div style="height:6px"></div>
    <div class="sample-timestamp">04:00:00 2026-05-15</div>
  </div>
  <div class="item">
    <div class="label">Section label usage</div>
    <div class="sample-label">API CONNECTION</div>
    <div style="height:6px"></div>
    <div class="sample-label">RAPID API KEY</div>
    <div style="height:6px"></div>
    <div class="sample-label">PUBLIC API BASE</div>
  </div>
  <div class="item">
    <div class="label">Plan / tier text</div>
    <div style="font-size:13px;color:var(--fg-secondary);margin-bottom:4px;">Com'Uniti</div>
    <div style="font-size:13px;color:var(--fg-secondary);margin-bottom:4px;">PRO / Propulse</div>
    <div style="font-size:13px;color:var(--fg-secondary);">Malou</div>
  </div>
</div>
</body>
</html>
