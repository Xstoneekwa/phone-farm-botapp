<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotApp v2 — Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; overflow: hidden; }
  body { font-family: "Inter", system-ui, -apple-system, sans-serif; background: #111213; }
  #root { display: flex; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Load shared design system first -->
<script type="text/babel" src="Design.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Overview.jsx"></script>
<script type="text/babel" src="ProfilesV2.jsx"></script>
<script type="text/babel" src="DevicesV2.jsx"></script>
<script type="text/babel" src="ActivityLog.jsx"></script>
<script type="text/babel" src="Targets.jsx"></script>
<script type="text/babel" src="DMTemplates.jsx"></script>
<script type="text/babel" src="NotificationsView.jsx"></script>
<script type="text/babel" src="APIKeysView.jsx"></script>
<script type="text/babel" src="SettingsV2.jsx"></script>

<script type="text/babel">

// ── Command Palette ────────────────────────────────────────
const PALETTE_ITEMS = [
  { label: 'Go to Overview',         section: 'overview',  icon: 'home'        },
  { label: 'Go to Profiles',         section: 'profiles',  icon: 'users'       },
  { label: 'Go to Devices',          section: 'devices',   icon: 'smartphone'  },
  { label: 'Go to Targets',          section: 'targets',   icon: 'target'      },
  { label: 'Go to DM Templates',     section: 'dms',       icon: 'message'     },
  { label: 'Go to Activity Log',     section: 'activity',  icon: 'list'        },
  { label: 'Go to Notifications',    section: 'notifs',    icon: 'bell'        },
  { label: 'Go to API / Webhooks',   section: 'api',       icon: 'key'         },
  { label: 'Go to Settings',         section: 'settings',  icon: 'settings'    },
];

const CommandPalette = ({ onNav, onClose }) => {
  const [q, setQ] = React.useState('');
  const inputRef = React.useRef(null);
  const [cursor, setCursor] = React.useState(0);

  React.useEffect(() => { inputRef.current?.focus(); }, []);

  const filtered = PALETTE_ITEMS.filter(i => !q || i.label.toLowerCase().includes(q.toLowerCase()));

  const go = (item) => { onNav(item.section); onClose(); };

  const onKey = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setCursor(c => Math.min(c + 1, filtered.length - 1)); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); setCursor(c => Math.max(c - 1, 0)); }
    if (e.key === 'Enter' && filtered[cursor]) go(filtered[cursor]);
    if (e.key === 'Escape') onClose();
  };

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 600,
      background: 'rgba(0,0,0,0.4)', backdropFilter: 'blur(8px)',
      display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
      paddingTop: '15vh',
    }} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{
        width: 520, background: '#fff', borderRadius: 12,
        boxShadow: '0 20px 60px rgba(0,0,0,0.25), 0 4px 16px rgba(0,0,0,0.12)',
        overflow: 'hidden', animation: 'modalIn 150ms cubic-bezier(0.16,1,0.3,1)',
      }}>
        {/* Search */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px', borderBottom: '1px solid #E6E6E4' }}>
          <Ico n="search" size={15} color="#9EA3B0"/>
          <input
            ref={inputRef} value={q} onChange={e => { setQ(e.target.value); setCursor(0); }}
            onKeyDown={onKey}
            placeholder="Search commands…"
            style={{ flex: 1, border: 'none', background: 'transparent', fontSize: 14, fontFamily: '"Inter", sans-serif', color: '#0F1117', outline: 'none' }}
          />
          <kbd style={{ fontSize: 11, background: '#F3F4F6', border: '1px solid #E6E6E4', borderRadius: 4, padding: '2px 6px', color: '#9EA3B0' }}>Esc</kbd>
        </div>
        {/* Results */}
        <div style={{ maxHeight: 340, overflow: 'auto', padding: '4px 6px' }}>
          {filtered.length === 0 && (
            <div style={{ padding: '20px', textAlign: 'center', fontSize: 13, color: '#9EA3B0' }}>No commands found</div>
          )}
          {filtered.map((item, i) => (
            <div key={item.label} onClick={() => go(item)} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              padding: '9px 10px', borderRadius: 7, cursor: 'pointer',
              background: cursor === i ? '#EDE9FE' : 'transparent',
              color: cursor === i ? '#4338CA' : '#0F1117',
              transition: 'background 60ms',
            }}
              onMouseEnter={() => setCursor(i)}
            >
              <div style={{ width: 28, height: 28, borderRadius: 6, background: cursor === i ? '#DDD6FE' : '#F3F4F6', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <Ico n={item.icon} size={13} color={cursor === i ? '#6558F5' : '#6B7280'}/>
              </div>
              <span style={{ fontSize: 13, fontWeight: 400 }}>{item.label}</span>
              {cursor === i && <kbd style={{ marginLeft: 'auto', fontSize: 10, background: '#DDD6FE', border: '1px solid #C4B5FD', borderRadius: 4, padding: '2px 5px', color: '#4338CA' }}>↵ Enter</kbd>}
            </div>
          ))}
        </div>
        <div style={{ padding: '8px 16px', borderTop: '1px solid #F0F0EE', display: 'flex', gap: 16 }}>
          {[['↑↓','Navigate'],['↵','Select'],['Esc','Close']].map(([k,l]) => (
            <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
              <kbd style={{ fontSize: 11, background: '#F3F4F6', border: '1px solid #E6E6E4', borderRadius: 4, padding: '1px 5px', color: '#9EA3B0' }}>{k}</kbd>
              <span style={{ fontSize: 11, color: '#9EA3B0' }}>{l}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── Top bar ────────────────────────────────────────────────
const TopBar = ({ view, onPalette, onNav, notifCount }) => (
  <div style={{
    height: 38, background: '#fff', borderBottom: '1px solid #E6E6E4',
    display: 'flex', alignItems: 'center', gap: 0, padding: '0 16px',
    flexShrink: 0, userSelect: 'none',
  }}>
    {/* Breadcrumb */}
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, color: '#9EA3B0', flex: 1 }}>
      <span>BotApp</span>
      <Ico n="chevR" size={12} color="#D1D5DB"/>
      <span style={{ color: '#0F1117', fontWeight: 500, textTransform: 'capitalize' }}>{view}</span>
    </div>
    {/* Search button (opens palette) */}
    <button onClick={onPalette} style={{
      display: 'flex', alignItems: 'center', gap: 8,
      background: '#F7F7F6', border: '1px solid #E6E6E4', borderRadius: 6,
      padding: '4px 12px', cursor: 'pointer', color: '#9EA3B0',
      fontSize: 12, fontFamily: '"Inter", sans-serif',
    }}>
      <Ico n="search" size={12}/>
      Quick search…
      <kbd style={{ fontSize: 10, background: '#ECECEB', border: '1px solid #E6E6E4', borderRadius: 4, padding: '1px 5px', marginLeft: 4 }}>⌘K</kbd>
    </button>
    {/* Notif bell */}
    <button onClick={() => onNav('notifs')} style={{
      position: 'relative', width: 30, height: 30, borderRadius: 6,
      background: 'transparent', border: 'none', cursor: 'pointer',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: '#5C6070', marginLeft: 8,
    }}
      onMouseEnter={e => e.currentTarget.style.background = '#F3F4F6'}
      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
    >
      <Ico n="bell" size={15}/>
      {notifCount > 0 && (
        <span style={{
          position: 'absolute', top: 4, right: 4,
          width: 7, height: 7, borderRadius: '50%',
          background: '#DC2626', border: '1.5px solid #fff',
        }}/>
      )}
    </button>
  </div>
);

// ── Main App ───────────────────────────────────────────────
const NOTIF_COUNT = 4;

function App() {
  const [view, setView] = React.useState('overview');
  const [showPalette, setShowPalette] = React.useState(false);

  // ⌘K shortcut
  React.useEffect(() => {
    const handler = e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        setShowPalette(p => !p);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const renderView = () => {
    switch (view) {
      case 'overview':  return <Overview onNav={setView}/>;
      case 'profiles':  return <ProfilesV2/>;
      case 'devices':   return <DevicesV2/>;
      case 'activity':  return <ActivityLog/>;
      case 'targets':   return <Targets/>;
      case 'dms':       return <DMTemplates/>;
      case 'notifs':    return <NotificationsView/>;
      case 'api':       return <APIKeysView/>;
      case 'settings':  return <SettingsV2/>;
      default:          return <Overview onNav={setView}/>;
    }
  };

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', width: '100%' }}>
      {/* Sidebar */}
      <SidebarV2
        active={view}
        onNav={setView}
        counts={{ profiles: 202, devices: 43, notifs: NOTIF_COUNT }}
      />

      {/* Main panel */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0 }}>
        <TopBar
          view={view}
          onPalette={() => setShowPalette(true)}
          onNav={setView}
          notifCount={NOTIF_COUNT}
        />
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          {renderView()}
        </div>
      </div>

      {/* Command Palette */}
      {showPalette && (
        <CommandPalette
          onNav={setView}
          onClose={() => setShowPalette(false)}
        />
      )}

      {/* Toast container */}
      <Toasts/>
    </div>
  );
}

// Global keyframe animation
const styleTag = document.createElement('style');
styleTag.textContent = `
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.97) translateY(-8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
`;
document.head.appendChild(styleTag);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
