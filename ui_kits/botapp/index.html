<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotApp — UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #16181B; }
  #root { height: 100vh; display: flex; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }

  /* Modal overlay */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-box {
    background: white; border-radius: 12px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.18), 0 4px 12px rgba(0,0,0,0.10);
    width: 560px; overflow: hidden;
    animation: modalIn 200ms cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="ProfilesView.jsx"></script>
<script type="text/babel" src="DevicesView.jsx"></script>
<script type="text/babel" src="SettingsView.jsx"></script>
<script type="text/babel" src="APIView.jsx"></script>

<script type="text/babel">
// ── Appearance Modal ───────────────────────────────────────
const AppearanceModal = ({ onClose }) => {
  const themes = [
    { id: 'light',  name: 'MacOS Light',  desc: 'Premium native light mode',  colors: ['#F7F6F2','#6558F5','#1F2328'], current: true },
    { id: 'dark',   name: 'MacOS Dark',   desc: 'Premium native dark mode',   colors: ['#0F1012','#6558F5','#E0E0E0'] },
    { id: 'legacy', name: 'Legacy',       desc: 'Blue-grey canvas, purple + teal', colors: ['#B8C4D0','#6558F5','#0D9488'] },
    { id: 'custom', name: 'Custom',       desc: 'Your colors below',          colors: ['#F7F6F2','#6558F5','#1F2328'] },
  ];
  const [selectedTheme, setSelectedTheme] = React.useState('light');
  const colorFields = [
    { label: 'Accent',     val: '#6558F5', type: 'dark' },
    { label: 'Background', val: '#F7F6F2', type: 'light' },
    { label: 'Sidebar',    val: '#EBEBEE', type: 'light' },
    { label: 'Foreground', val: '#1F2328', type: 'dark' },
  ];

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box">
        {/* Header */}
        <div style={{ padding: '14px 18px 12px', borderBottom: '1px solid #ECECEC', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 500, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#9CA3AF', marginBottom: 3 }}>SYSTEM</div>
            <div style={{ fontSize: 17, fontWeight: 600, color: '#1F2328' }}>Appearance</div>
            <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>Theme, colors, typography, and interface preferences.</div>
          </div>
          <button onClick={onClose} style={{ width: 24, height: 24, borderRadius: '50%', border: '1px solid #E5E7EB', background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#9CA3AF' }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        {/* Body */}
        <div style={{ padding: '16px 18px' }}>
          {/* Theme picker */}
          <div style={{ fontSize: 13, fontWeight: 600, color: '#1F2328', marginBottom: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span>Theme</span>
            <span style={{ fontSize: 11, color: '#6558F5', fontWeight: 400 }}>Pick a built-in palette or roll your own with the colors below.</span>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 8, marginBottom: 16 }}>
            {themes.map(t => (
              <div key={t.id} onClick={() => setSelectedTheme(t.id)} style={{ borderRadius: 7, overflow: 'hidden', border: `2px solid ${selectedTheme === t.id ? '#6558F5' : '#E5E7EB'}`, cursor: 'pointer', transition: 'border-color 150ms' }}>
                <div style={{ display: 'flex', height: 36, overflow: 'hidden' }}>
                  {t.colors.map((c,i) => <div key={i} style={{ flex: 1, background: c }}/>)}
                </div>
                <div style={{ padding: '6px 8px', background: 'white' }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: '#1F2328' }}>{t.name}</div>
                  <div style={{ fontSize: 10, color: '#9CA3AF', marginTop: 1 }}>{t.desc}</div>
                  {t.current && <div style={{ fontSize: 10, color: '#6558F5', marginTop: 2 }}>Current</div>}
                </div>
              </div>
            ))}
          </div>

          {/* Colors */}
          <div style={{ fontSize: 13, fontWeight: 600, color: '#1F2328', marginBottom: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span>Colors</span>
            <span style={{ fontSize: 11, color: '#6558F5', fontWeight: 400 }}>Tweaking any value below switches you to the Custom theme automatically.</span>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 16 }}>
            {colorFields.map(({ label, val, type }) => (
              <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', border: '1px solid #E5E7EB', borderRadius: 6 }}>
                <div style={{ width: 18, height: 18, borderRadius: '50%', background: val, border: type === 'light' ? '1px solid #E5E7EB' : 'none', flexShrink: 0 }}/>
                <span style={{ flex: 1, fontSize: 13, color: '#1F2328' }}>{label}</span>
                <span style={{ fontSize: 11, fontFamily: '"DM Mono", monospace', color: '#6B7280' }}>{val}</span>
              </div>
            ))}
          </div>
        </div>
        {/* Footer */}
        <div style={{ padding: '10px 18px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid #ECECEC' }}>
          <button style={{ fontSize: 12, background: 'none', border: 'none', color: '#6B7280', cursor: 'pointer', fontFamily: 'inherit' }}>Reset to defaults</button>
          <button onClick={onClose} style={{ background: '#6558F5', color: 'white', border: 'none', borderRadius: 7, padding: '7px 20px', fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Done</button>
        </div>
      </div>
    </div>
  );
};

// ── Operators Modal ────────────────────────────────────────
const OperatorsModal = ({ onClose }) => {
  const [newName, setNewName] = React.useState('');
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{ width: 480 }}>
        <div style={{ padding: '14px 18px 12px', borderBottom: '1px solid #ECECEC', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 500, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#9CA3AF', marginBottom: 3 }}>PROFILES</div>
            <div style={{ fontSize: 17, fontWeight: 600, color: '#1F2328' }}>Operators</div>
          </div>
          <button onClick={onClose} style={{ width: 24, height: 24, borderRadius: '50%', border: '1px solid #E5E7EB', background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#9CA3AF' }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div style={{ padding: '16px 18px' }}>
          {/* Intro banner */}
          <div style={{ display: 'flex', gap: 12, padding: '10px 14px', background: '#F7F6F2', borderRadius: 8, marginBottom: 16 }}>
            <div style={{ width: 36, height: 36, borderRadius: '50%', background: '#EDE9FE', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6558F5" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: '#1F2328' }}>Set up your profile</div>
              <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>Each operator has its own theme, saved settings and preferences of Bot app.</div>
            </div>
          </div>
          {/* Operator row */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px', border: '1px solid #E5E7EB', borderRadius: 7, marginBottom: 10 }}>
            <div style={{ width: 32, height: 32, borderRadius: '50%', background: '#6558F5', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontSize: 14, fontWeight: 600, flexShrink: 0 }}>D</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: '#1F2328' }}>Default</div>
              <div style={{ fontSize: 11, color: '#9CA3AF' }}>Created at: 13.05.2026 · Last online 19h ago</div>
            </div>
            <StatusBadge type="active" label="Active" dot={false}/>
            <button style={{ width: 24, height: 24, borderRadius: 4, border: '1px solid #E5E7EB', background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#6B7280' }}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
          {/* Add row */}
          <div style={{ display: 'flex', gap: 8 }}>
            <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Add operator (e.g. George)"
              style={{ flex: 1, border: '1px solid #E5E7EB', background: '#F7F6F2', borderRadius: 6, padding: '7px 12px', fontSize: 13, fontFamily: 'inherit', outline: 'none', color: '#1F2328' }}/>
            <button style={{ background: '#6558F5', color: 'white', border: 'none', borderRadius: 6, padding: '7px 14px', fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 5 }}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// ── Bin View ───────────────────────────────────────────────
const BinView = () => {
  const [q, setQ] = React.useState('');
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#F7F6F2', fontFamily: '"DM Sans", system-ui, sans-serif' }}>
      <div style={{ padding: '8px 16px', display: 'flex', alignItems: 'center', gap: 8, borderBottom: '1px solid #ECECEC' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: '#EDE9FE', borderRadius: 9999, padding: '4px 10px' }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6558F5" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
          <span style={{ fontSize: 12, fontWeight: 500, color: '#4338CA' }}>100 accounts in bin</span>
        </div>
        <div style={{ flex: 1 }}/>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, border: '1px solid #E5E7EB', borderRadius: 6, padding: '5px 10px', background: 'white' }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="reedrestaurant" style={{ border: 'none', background: 'transparent', fontSize: 13, fontFamily: 'inherit', outline: 'none', width: 140, color: '#1F2328' }}/>
        </div>
      </div>
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 8 }}>
        <div style={{ fontSize: 14, fontWeight: 500, color: '#1F2328' }}>No profiles</div>
        <div style={{ fontSize: 13, color: '#9CA3AF' }}>Backend returned no profiles for this view.</div>
      </div>
    </div>
  );
};

// ── Account View (placeholder) ─────────────────────────────
const AccountView = ({ onOpenOperators }) => (
  <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: '#F7F6F2', gap: 12, fontFamily: '"DM Sans", system-ui, sans-serif' }}>
    <div style={{ width: 52, height: 52, borderRadius: '50%', background: '#6558F5', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div style={{ fontSize: 15, fontWeight: 600, color: '#1F2328' }}>Default</div>
    <div style={{ fontSize: 12, color: '#9CA3AF' }}>Last online 19h ago</div>
    <button onClick={onOpenOperators} style={{ background: '#6558F5', color: 'white', border: 'none', borderRadius: 6, padding: '7px 18px', fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit', marginTop: 4 }}>
      Manage operators
    </button>
  </div>
);

// ── Main App ───────────────────────────────────────────────
function App() {
  const [activeView, setActiveView] = React.useState('profiles');
  const [modal, setModal]           = React.useState(null); // 'appearance' | 'operators'

  const handleNav = (id) => {
    if (id === 'account') { setModal('operators'); return; }
    setActiveView(id);
  };

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <Sidebar active={activeView} onNav={handleNav}/>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex' }}>
        {activeView === 'profiles'  && <ProfilesView/>}
        {activeView === 'devices'   && <DevicesView/>}
        {activeView === 'bin'       && <BinView/>}
        {activeView === 'settings'  && (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            {/* Settings sub-nav */}
            <div style={{ display: 'flex', gap: 0, borderBottom: '1px solid #ECECEC', background: 'white', padding: '0 24px' }}>
              {[
                { id: 'settings', label: 'Config' },
                { id: 'api',      label: 'API Gateway' },
              ].map(({ id, label }) => (
                <button key={id} onClick={() => setActiveView(id)}
                  style={{ padding: '10px 14px', fontSize: 13, fontWeight: activeView === id ? 600 : 400, color: activeView === id ? '#6558F5' : '#6B7280', background: 'transparent', border: 'none', borderBottom: activeView === id ? '2px solid #6558F5' : '2px solid transparent', cursor: 'pointer', fontFamily: 'inherit', marginBottom: -1 }}>
                  {label}
                </button>
              ))}
              <div style={{ flex: 1 }}/>
              <button onClick={() => setModal('appearance')}
                style={{ padding: '10px 14px', fontSize: 13, color: '#6B7280', background: 'transparent', border: 'none', cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 5 }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Appearance
              </button>
            </div>
            <div style={{ flex: 1, overflow: 'auto', display: 'flex' }}>
              <SettingsView/>
            </div>
          </div>
        )}
        {activeView === 'api' && (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            <div style={{ display: 'flex', gap: 0, borderBottom: '1px solid #ECECEC', background: 'white', padding: '0 24px' }}>
              {[
                { id: 'settings', label: 'Config' },
                { id: 'api',      label: 'API Gateway' },
              ].map(({ id, label }) => (
                <button key={id} onClick={() => setActiveView(id)}
                  style={{ padding: '10px 14px', fontSize: 13, fontWeight: activeView === id ? 600 : 400, color: activeView === id ? '#6558F5' : '#6B7280', background: 'transparent', border: 'none', borderBottom: activeView === id ? '2px solid #6558F5' : '2px solid transparent', cursor: 'pointer', fontFamily: 'inherit', marginBottom: -1 }}>
                  {label}
                </button>
              ))}
              <div style={{ flex: 1 }}/>
              <button onClick={() => setModal('appearance')}
                style={{ padding: '10px 14px', fontSize: 13, color: '#6B7280', background: 'transparent', border: 'none', cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 5 }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/></svg>
                Appearance
              </button>
            </div>
            <div style={{ flex: 1, overflow: 'auto', display: 'flex' }}>
              <APIView/>
            </div>
          </div>
        )}
      </div>

      {/* Modals */}
      {modal === 'appearance' && <AppearanceModal onClose={() => setModal(null)}/>}
      {modal === 'operators'  && <OperatorsModal  onClose={() => setModal(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
